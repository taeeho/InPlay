spring:
  application:
    name: inplay
  threads:
    virtual:
      enabled: true
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/inplay}
  security:
    user:
      name: dev
      password: dev   # local-only, prod는 API key filter로 대체

server:
  port: 8080
  tomcat:
    threads:
      max: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

inplay:
  default-user:
    name: ${INPLAY_DEFAULT_USER_NAME:taeeho}
    team: ${INPLAY_DEFAULT_USER_TEAM:HH}
    timezone: ${INPLAY_DEFAULT_USER_TIMEZONE:Asia/Seoul}
    mute-window:
      start: ${INPLAY_DEFAULT_USER_MUTE_START:08:00}
      end: ${INPLAY_DEFAULT_USER_MUTE_END:10:00}
    discord-webhook: ${INPLAY_DEFAULT_DISCORD_WEBHOOK:}
  brief:
    scheduler:
      enabled: ${INPLAY_BRIEF_SCHEDULER_ENABLED:true}
    cron: ${INPLAY_BRIEF_CRON:0 0 8 * * *}
    timezone: ${INPLAY_BRIEF_TIMEZONE:Asia/Seoul}
  clutch:
    enabled: ${INPLAY_CLUTCH_ENABLED:true}
    importance-threshold: ${INPLAY_CLUTCH_THRESHOLD:3.0}
    cooldown: ${INPLAY_CLUTCH_COOLDOWN:PT5M}
    dedupe-ttl: ${INPLAY_CLUTCH_DEDUPE_TTL:PT1M}
    detector-threshold: ${INPLAY_CLUTCH_DETECTOR_THRESHOLD:0.7}
  collector:
    kbo:
      schedule-url: ${INPLAY_KBO_SCHEDULE_URL:https://www.koreabaseball.com/Schedule/Schedule.aspx}
      # http: jsoup-only(데이터 비어있음, W1 게이트 통과 X)
      # headless: Playwright SSR 렌더링 후 DOM 파싱 (ADR-008/009) — 운영 기본값
      mode: ${INPLAY_KBO_COLLECTOR_MODE:headless}
    schedule:
      # KBO 일정 주기 수집 → mongo game upsert. UA는 코드 상수(KboHeadlessScheduleSource.USER_AGENT / CollectorUserAgent.VALUE).
      enabled: ${INPLAY_COLLECTOR_SCHEDULE_ENABLED:true}
      interval: ${INPLAY_COLLECTOR_SCHEDULE_INTERVAL:5m}
      initial-delay: ${INPLAY_COLLECTOR_SCHEDULE_INITIAL_DELAY:10s}
      window-days: ${INPLAY_COLLECTOR_SCHEDULE_WINDOW_DAYS:7}
    # W3 라이브 이벤트 polling(30s)·비시즌 뉴스 수집은 미구현 — 별도 config 로 추가 예정.
  ml:
    model-dir: ${INPLAY_MODEL_DIR:modules/ml-inference/src/main/resources/models}
  notion:
    api-key: ${NOTION_API_KEY:}
    journal-database-id: ${NOTION_JOURNAL_DATABASE_ID:}
    version: ${NOTION_VERSION:2022-06-28}
  journal:
    # 종료 경기 → Notion season_journal 자동 기록. api-key/journal-database-id 미설정 시 skip.
    scheduler:
      enabled: ${INPLAY_JOURNAL_SCHEDULER_ENABLED:true}
    cron: ${INPLAY_JOURNAL_CRON:0 30 23 * * *}
    timezone: ${INPLAY_JOURNAL_TIMEZONE:Asia/Seoul}

logging:
  level:
    com.inplay: DEBUG
    org.springframework.web: INFO
    org.springframework.data.mongodb: INFO
