# inplay 로컬 인프라 (Podman compose)
# 사용:
#   podman compose -f infra/compose/podman-compose.yml up -d
#   podman compose -f infra/compose/podman-compose.yml down
#
# 초기화 흐름:
#   mongo (healthy)
#     -> mongo-init (rs.initiate + timeseries 컬렉션 + 인덱스, 멱등)
#     -> mongo-express

version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: inplay-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      # ping은 mongod 기동 여부만 본다. 단일 노드 rs0이므로 PRIMARY까지
      # 확인되어야 application driver가 안전하게 붙는다.
      # rs.status()는 init 전엔 실패하므로 'NotYetInitialized'(94)는 허용.
      test:
        - "CMD"
        - "mongosh"
        - "--quiet"
        - "--eval"
        - >-
          try {
            const s = rs.status();
            quit(s.myState === 1 ? 0 : 1);
          } catch (e) {
            quit(e.code === 94 ? 0 : 1);
          }
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  mongo-init:
    image: mongo:7
    container_name: inplay-mongo-init
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./mongo-init:/init:ro
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        for f in /init/*.js; do
          echo "[mongo-init] running $$f"
          mongosh --host mongo:27017 --quiet --file "$$f"
        done
        echo "[mongo-init] all init scripts completed"

  mongo-express:
    image: mongo-express:1.0
    container_name: inplay-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://mongo:27017/?replicaSet=rs0"
      ME_CONFIG_BASICAUTH_USERNAME: ""
      ME_CONFIG_BASICAUTH_PASSWORD: ""
    depends_on:
      mongo-init:
        condition: service_completed_successfully

volumes:
  mongo-data:
